<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>News App</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
    nav { background: #222; padding: 15px; }
    nav a { color: white; text-decoration: none; margin-right: 20px; font-weight: bold; }
    nav a.active { color: #ff5252; }
    .box { max-width: 700px; margin: 20px auto; padding: 15px; }
    .card { background: white; padding: 15px; margin-bottom: 12px; border-radius: 5px; border: 1px solid #ddd; }
    .breaking { border-left: 5px solid red; }
    .tag { background: red; color: white; font-size: 11px; padding: 2px 6px; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const newsList = [
      { id: 1, title: "New Tech Park Opened in City", breaking: true, text: "Over 5,000 new IT jobs expected this year." },
      { id: 2, title: "Heavy Rain Alert Issued", breaking: true, text: "Meteorological department advises people to stay indoors." },
      { id: 3, title: "National Cricket Team Wins Series", breaking: false, text: "Team clinches victory by 6 wickets in the final match." },
      { id: 4, title: "ISRO Prepares Next Satellite Launch", breaking: false, text: "Countdown begins for the upcoming communication mission." }
    ];

    function useHashRoute() {
      const getPath = () => window.location.hash.replace(/^#/, "") || "/";
      const [path, setPath] = useState(getPath);

      useEffect(() => {
        const onHashChange = () => setPath(getPath());
        window.addEventListener("hashchange", onHashChange);
        return () => window.removeEventListener("hashchange", onHashChange);
      }, []);

      return path;
    }

    function Headlines() {
      return (
        <div className="box">
          <h2>Top Headlines</h2>
          {newsList.map((item) => (
            <div className="card" key={item.id}>
              {item.breaking && <span className="tag">BREAKING</span>}
              <h3>{item.title}</h3>
              <p>{item.text}</p>
              <a href={`#/news/${item.id}`}>Read More</a>
            </div>
          ))}
        </div>
      );
    }

    function Breaking() {
      const breakingNews = newsList.filter((item) => item.breaking);
      return (
        <div className="box">
          <h2>Breaking News</h2>
          {breakingNews.map((item) => (
            <div className="card breaking" key={item.id}>
              <h3>{item.title}</h3>
              <p>{item.text}</p>
              <a href={`#/news/${item.id}`}>Read More</a>
            </div>
          ))}
        </div>
      );
    }

    function NewsDetail({ id }) {
      const item = newsList.find((n) => n.id === Number(id));
      if (!item) {
        return (
          <div className="box card">
            <p>News item not found.</p>
            <a href="#/">← Back</a>
          </div>
        );
      }
      return (
        <div className="box card">
          <h2>{item.title}</h2>
          <p>{item.text}</p>
          <a href="#/">← Back</a>
        </div>
      );
    }

    function App() {
      const path = useHashRoute();
      const detailMatch = path.match(/^\/news\/(\d+)$/);

      return (
        <div>
          <nav>
            <a href="#/" className={path === "/" ? "active" : ""}>Headlines</a>
            <a href="#/breaking" className={path === "/breaking" ? "active" : ""}>Breaking News</a>
          </nav>

          {path === "/" && <Headlines />}
          {path === "/breaking" && <Breaking />}
          {detailMatch && <NewsDetail id={detailMatch[1]} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
